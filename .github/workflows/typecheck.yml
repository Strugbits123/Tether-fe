# Type checking moved out of `next build`.
#
# The Vercel builder (4 cores / 8 GB) cannot hold the Turbopack compile and the
# TypeScript checker at the same time — builds were being OOM-killed after ~7
# minutes inside the type-check step, for a job that takes ~15 seconds here.
# next.config.ts therefore sets `typescript.ignoreBuildErrors`, and this workflow
# is what keeps that honest: the exact same `tsc --noEmit` runs on every push and
# pull request, so a type error fails the PR instead of the deploy.
#
# If you remove this workflow, re-enable type checking in next.config.ts.
name: Typecheck

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` needs the lockfile to be in sync with package.json; it fails
      # loudly if not, which is the behaviour we want in CI.
      - run: npm ci

      # The blocking check. This is the one that replaces type checking during
      # `next build`, so it must stay required.
      - name: Type check
        run: npm run typecheck

      # Advisory only. The repo currently has 43 pre-existing eslint errors
      # across 25 files (mostly react-hooks/set-state-in-effect and
      # no-explicit-any) that predate this workflow. Blocking on them would fail
      # every PR for problems it didn't introduce, which trains people to ignore
      # CI. Results are still surfaced in the job output.
      #
      # Flip this to blocking (delete continue-on-error) once that backlog is
      # cleared — that's the point at which lint starts carrying real signal.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
